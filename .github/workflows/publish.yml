name: Publish Subspace to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install npm and Bun
        run: |
          npm install --global npm@11.5.1 bun@1.3.11
          npm --version
          bun --version
      - name: Validate tag and package license
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [[ "v$version" == "$RELEASE_VERSION" && "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          test "$(cat npm/LICENSE-SPDX)" = MIT
          test -f npm/LICENSE
          printf 'Release version: %s\n' "$version"
          echo "SUBSPACE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test npm package
        run: bun test tests/npm-package.test.ts
      - name: Build npm package
        run: bun src/package/build.ts --npm --version "$SUBSPACE_VERSION"
      - name: Check built npm package
        run: bash check-package.sh out/npm "$SUBSPACE_VERSION"
      - name: Publish with npm provenance
        run: npm publish out/npm --access public
